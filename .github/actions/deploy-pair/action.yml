name: Deploy Worker pair
description: >
  Applies D1 migrations with the Cloudflare CLI, then deploys the engine and web Workers
  with wrangler. Each Worker receives the secrets its wrangler config lists in
  secrets.required, read from environment variables that the calling step sets by name
  from the GitHub Environment (TECH_STACK S35).
inputs:
  wrangler-env:
    description: Wrangler environment (staging, production) or empty when using config-file.
    default: ""
  config-file:
    description: Wrangler config file name inside each app (wrangler.jsonc or wrangler.preview.jsonc).
    default: wrangler.jsonc
  version:
    description: Value for the VERSION var (git SHA).
    required: true
runs:
  using: composite
  steps:
    - name: Build web
      shell: bash
      run: pnpm --filter @claimsale/web build
    - name: Apply D1 migrations (cf)
      shell: bash
      run: |
        set -euo pipefail
        db_id="$(node scripts/d1-id.ts "apps/engine/${{ inputs.config-file }}" ${{ inputs.wrangler-env }} 2>/dev/null)"
        pnpm exec cf d1 migrations apply "$db_id" --dir packages/db/migrations
    - name: Deploy engine, then web (wrangler)
      shell: bash
      run: |
        set -euo pipefail
        envflag="${{ inputs.wrangler-env && format('--env {0}', inputs.wrangler-env) || '' }}"
        for app in engine web; do
          node scripts/secrets-for.ts "apps/$app/${{ inputs.config-file }}" ${{ inputs.wrangler-env }} \
            > "$RUNNER_TEMP/$app-secrets.json"
          (cd "apps/$app" && pnpm exec wrangler deploy -c "${{ inputs.config-file }}" $envflag \
            --var "VERSION:${{ inputs.version }}" --secrets-file "$RUNNER_TEMP/$app-secrets.json")
        done
    - name: Remove secret files
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP"/*-secrets.json
