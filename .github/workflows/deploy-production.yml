name: Deploy production

# main is always production (TECH_STACK S24). The production environment requires
# manual approval in the repository settings.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Record a D1 Time Travel bookmark before migrating (rollback point)
        working-directory: apps/engine
        run: pnpm exec wrangler d1 time-travel info claimsale-production --json | tee "$RUNNER_TEMP/d1-bookmark.json"
      - name: Ensure the production queue exists
        working-directory: apps/engine
        run: pnpm exec wrangler queues info claimsale-notifications > /dev/null 2>&1 || pnpm exec wrangler queues create claimsale-notifications
      - uses: ./.github/actions/deploy-pair
        with:
          wrangler-env: production
          doppler-config: prd
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          version: ${{ github.sha }}
      - name: Smoke test (@critical) against production
        run: |
          pnpm --filter @claimsale/web exec playwright install --with-deps chromium
          pnpm --filter @claimsale/web exec playwright test --grep @critical --project chromium-desktop
        env:
          CI: "true"
          E2E_BASE_URL: ${{ vars.PRODUCTION_URL }}
      - name: Tag the release (CalVer) and publish notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="$(date -u +%Y.%-m)"
          n=$(git tag --list "$prefix.*" | wc -l)
          tag="$prefix.$((n + 1))"
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          notes="$(git log --no-merges --pretty='- %s (%h)' ${prev:+$prev..}HEAD)"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$notes"
      - name: Back-merge main into dev (after hotfixes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin dev
          if git diff --quiet origin/dev "$GITHUB_SHA"; then exit 0; fi
          if [ -z "$(gh pr list --base dev --head main --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base dev --head main --title "Back-merge main into dev" \
              --body "$(printf 'main has changes that dev does not (a hotfix). Merge with a merge commit.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')"
          fi
