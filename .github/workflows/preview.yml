name: PR preview

# One full Worker pair per PR (TECH_STACK T30): its own engine, web, D1 and queue.
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # Forks get no secrets; only same-repo PRs get previews.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Ensure the PR's D1 database and queue exist
        id: resources
        working-directory: apps/engine
        run: |
          set -euo pipefail
          db="claimsale-pr-$PR"
          id=$(pnpm exec wrangler d1 list --json | jq -r --arg n "$db" '.[] | select(.name == $n) | .uuid')
          if [ -z "$id" ]; then
            pnpm exec wrangler d1 create "$db" --location enam
            id=$(pnpm exec wrangler d1 list --json | jq -r --arg n "$db" '.[] | select(.name == $n) | .uuid')
          fi
          echo "d1_id=$id" >> "$GITHUB_OUTPUT"
          q="claimsale-notifications-pr-$PR"
          pnpm exec wrangler queues info "$q" > /dev/null 2>&1 || pnpm exec wrangler queues create "$q"
      - run: node scripts/preview-config.ts --pr "$PR" --d1-id "${{ steps.resources.outputs.d1_id }}" --version "${{ github.sha }}"
      - uses: ./.github/actions/deploy-pair
        with:
          config-file: wrangler.preview.jsonc
          doppler-config: prv
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          version: ${{ github.sha }}
      - name: Smoke test (@critical) against the preview
        run: |
          pnpm --filter @claimsale/web exec playwright install --with-deps chromium
          pnpm --filter @claimsale/web exec playwright test --grep @critical --project chromium-desktop
        env:
          CI: "true"
          E2E_BASE_URL: https://claimsale-web-pr-${{ github.event.pull_request.number }}.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
          E2E_ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          E2E_ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
      - name: Comment the preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://claimsale-web-pr-${context.issue.number}.${process.env.SUBDOMAIN}.workers.dev`;
            const marker = "<!-- claimsale-preview -->";
            const body = `${marker}\nPreview for ${context.sha.slice(0, 7)}: ${url}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
        env:
          SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
