name: Open release PR

# Batches dev into a release: opens (or refreshes) a PR from dev to main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet origin/main origin/dev; then
            echo "dev and main have identical trees; nothing to release."
            exit 0
          fi
          body="$(printf 'Release of `dev` into `main`.\n\n## Changes\n\n%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$(git log --no-merges --pretty='- %s (%h)' origin/main..origin/dev)")"
          existing=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --base main --head dev --title "Release $(date -u +%Y-%m-%d)" --body "$body"
          fi
