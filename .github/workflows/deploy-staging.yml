name: Deploy staging

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Ensure the staging queue exists
        working-directory: apps/engine
        run: pnpm exec wrangler queues info claimsale-notifications-staging > /dev/null 2>&1 || pnpm exec wrangler queues create claimsale-notifications-staging
      - uses: ./.github/actions/deploy-pair
        with:
          wrangler-env: staging
          doppler-config: stg
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          version: ${{ github.sha }}
      - name: Smoke test (@critical) against staging
        run: |
          pnpm --filter @claimsale/web exec playwright install --with-deps chromium
          pnpm --filter @claimsale/web exec playwright test --grep @critical --project chromium-desktop
        env:
          CI: "true"
          E2E_BASE_URL: ${{ vars.STAGING_URL }}
          E2E_ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          E2E_ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
