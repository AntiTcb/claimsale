name: PR preview cleanup

on:
  pull_request:
    branches: [dev]
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Delete the preview pair, its queue and its database
        working-directory: apps/engine
        run: |
          # Web first (it binds to the engine), then the engine, queue and D1.
          pnpm exec wrangler delete --name "claimsale-web-pr-$PR" --force || true
          pnpm exec wrangler delete --name "claimsale-engine-pr-$PR" --force || true
          pnpm exec wrangler queues delete "claimsale-notifications-pr-$PR" --force || true
          pnpm exec wrangler d1 delete "claimsale-pr-$PR" --skip-confirmation || true
