name: PR preview cleanup

on:
  pull_request:
    branches: [dev]
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Delete the preview pair, its queue and its database (cf)
        run: |
          # Web first (it binds to the engine), then the engine, queue and D1.
          scripts/cf-resources.sh delete-worker "claimsale-web-pr-$PR"
          scripts/cf-resources.sh delete-worker "claimsale-engine-pr-$PR"
          scripts/cf-resources.sh delete-queue "claimsale-notifications-pr-$PR"
          scripts/cf-resources.sh delete-d1 "claimsale-pr-$PR"
