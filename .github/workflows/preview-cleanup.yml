name: PR preview cleanup

on:
  pull_request:
    branches: [dev]
    types: [closed]
  # Manual cleanup, e.g. for a preview whose automatic cleanup failed.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose preview resources to delete
        required: true
        type: number

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Delete the PR's Worker Preview of claimsale-web-staging, if any (wrangler)
        # A PR may have had either kind of preview, or both (TECH_STACK S37).
        run: |
          if ! out="$(cd apps/web && pnpm exec wrangler preview delete --env staging --name "pr-$PR" --skip-confirmation 2>&1)"; then
            printf '%s\n' "$out"
            # 10025: the API's "Preview not found"; any other failure fails the job.
            if printf '%s' "$out" | grep -q "\[code: 10025\]"; then
              echo "No Worker Preview named pr-$PR."
            else
              exit 1
            fi
          fi
      - name: Delete the preview pair, its queue and its database (cf)
        run: |
          # Web first (it binds to the engine), then the engine, queue and D1.
          scripts/cf-resources.sh delete-worker "claimsale-web-pr-$PR"
          scripts/cf-resources.sh delete-worker "claimsale-engine-pr-$PR"
          scripts/cf-resources.sh delete-queue "claimsale-notifications-pr-$PR"
          scripts/cf-resources.sh delete-d1 "claimsale-pr-$PR"
