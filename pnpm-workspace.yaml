packages:
  - apps/*
  - packages/*

# Supply-chain guard: never install a version published less than 3 days ago (TECH_STACK §6).
minimumReleaseAge: 4320

# Packages allowed to run install scripts (native binaries).
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

# Shared versions. Renovate updates these in one place.
catalog:
  # Framework
  "@sveltejs/kit": 3.0.0
  "@sveltejs/adapter-cloudflare": 8.0.0
  "@sveltejs/vite-plugin-svelte": 7.3.1
  svelte: 5.57.1
  svelte-check: 4.7.6
  vite: 8.3.2
  # Cloudflare
  wrangler: 4.147.0
  "@cloudflare/workers-types": 5.20261005.1
  # Effect (always updated together)
  effect: 4.0.1
  "@effect/vitest": 4.0.1
  "@effect/language-service": 0.87.3
  # Data
  drizzle-orm: 0.45.3
  drizzle-kit: 0.31.11
  uuidv7: 1.2.1
  # UI
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  # Testing
  vitest: 5.0.3
  "@vitest/browser-playwright": 5.0.3
  "@vitest/coverage-v8": 5.0.3
  vitest-browser-svelte: 3.1.0
  "@playwright/test": 1.63.0
  "@axe-core/playwright": 4.13.0
  fast-check: 4.10.2
  msw: 3.0.2
  # Tooling
  typescript: 6.0.3
  "@types/node": 26.6.4
  oxlint: 1.87.0
  oxlint-tsgolint: 7.0.2003
  oxfmt: 0.72.0

# Workers integration tests (apps/engine) stay on Vitest 4.1 until
# @cloudflare/vitest-plugin >= 1.4.0 (the first Vitest 5 release, 2026-10-08)
# passes the release-age window. Renovate then moves them to the default catalog.
catalogs:
  workers-test:
    vitest: 4.1.11
    "@cloudflare/vitest-plugin": 1.3.6
